    <text x="14" y="706" style="font-size:15px;font-weight:800;">1 : 150 (MEP / LIGHTING)</text>
    <text x="14" y="726" style="font-size:9.5px;fill:#475569;">30° / 60° FLW TRIANGULAR MODULE</text>

    <!-- Sheet Title & Sheet Number Box -->
    <line x1="0" y1="1040" x2="282" y2="1040" stroke="#0f172a" stroke-width="1.5"/>
